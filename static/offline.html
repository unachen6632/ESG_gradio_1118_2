<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>目前離線｜CSV 查詢器</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #e0f2fe); color: #0f172a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      .card { background: #1e293b; }
    }
    .card { max-width: 420px; width: 100%; text-align: center; background: #fff;
            padding: 32px 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(15,23,42,.12); }
    .emoji { font-size: 56px; }
    h1 { font-size: 1.4rem; margin: 12px 0 8px; }
    p { margin: 0 0 20px; color: #64748b; line-height: 1.6; }
    button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 12px; cursor: pointer;
             font-size: 1rem; font-weight: 600; color: #fff; background: #4f46e5; }
    button:active { transform: scale(.98); }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">📡</div>
    <h1>目前沒有網路連線</h1>
    <p>資料下載與搜尋需要連上網路。請確認連線後再重新載入。</p>
    <button type="button" onclick="location.reload()">重新載入</button>
  </main>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
